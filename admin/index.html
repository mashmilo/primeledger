<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin</title>
<style>body{font:15px system-ui;margin:0;background:#f3f5f9;color:#1a2233}.w{max-width:960px;margin:auto;padding:16px}.c{background:#fff;border-radius:10px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0002}input,textarea,select{width:100%;padding:8px;margin:4px 0 10px;border:1px solid #ccd;border-radius:6px;font:inherit;box-sizing:border-box}textarea{min-height:360px;font-family:monospace;font-size:13px}button{padding:9px 16px;border:0;border-radius:6px;background:#0b5fff;color:#fff;cursor:pointer;margin:2px}button.g{background:#667}button.r{background:#d33}.t button{background:#dde}.t button.on{background:#0b5fff;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-weight:600;font-size:13px}#m{position:fixed;top:10px;right:10px;background:#111;color:#fff;padding:10px 16px;border-radius:8px;display:none}</style></head><body><div class="w">
<h2>Admin Panel</h2><div id="m"></div>
<div class="c"><b>GitHub connection</b> (stored only in this browser)<div class="row"><div><label>Repo (user/repo)</label><input id="repo"></div><div><label>Branch</label><input id="br" value="main"></div></div><label>Personal access token (fine-grained, Contents: read/write on this repo only)</label><input id="tok" type="password"><button onclick="saveC()">Save connection</button></div>
<div class="t"><button id="b1" class="on" onclick="tab(1)">Posts &amp; Pages</button><button id="b2" onclick="tab(2)">Theme &amp; Ads</button><button id="b3" onclick="tab(3)">AI post prompt</button></div>
<div id="t1" class="c"><button onclick="ls('posts')">List posts</button><button onclick="ls('pages')">List pages</button><button class="g" onclick="newPost()">+ New post</button><div id="list"></div>
<label>Upload image (auto-resized, saved to your repo)</label><input type="file" id="im" accept="image/*" onchange="upImg()"><label>File path</label><input id="fp" placeholder="posts/my-slug.md"><label>Content (paste the full AI-written markdown with the --- header)</label><textarea id="ed"></textarea><button onclick="savePost()">Publish / Save</button><button class="r" onclick="del()">Delete file</button></div>
<div id="t2" class="c" style="display:none"><button onclick="loadS()">Load settings</button><div id="sf"></div></div>
<div id="t3" class="c" style="display:none"><p>Give this prompt to Claude, replacing the topic. Paste Claude's whole answer into the Content box and press Publish.</p><textarea id="pr" style="min-height:260px" readonly></textarea><button onclick="pr.select();document.execCommand('copy')">Copy prompt</button></div>
</div><script>
var $=function(i){return document.getElementById(i)},S,sha={};
repo.value=localStorage.repo||'';br.value=localStorage.br||'main';tok.value=localStorage.tok||'';
function saveC(){localStorage.repo=repo.value;localStorage.br=br.value;localStorage.tok=tok.value;msg('Saved')}
function msg(t){m.textContent=t;m.style.display='block';setTimeout(function(){m.style.display='none'},2500)}
function tab(n){[1,2,3].forEach(function(i){$('t'+i).style.display=i==n?'block':'none';$('b'+i).className=i==n?'on':''})}
function api(p,o){o=o||{};o.headers={Authorization:'Bearer '+tok.value,Accept:'application/vnd.github+json'};return fetch('https://api.github.com/repos/'+repo.value+'/contents/'+p+(o.method?'':'?ref='+br.value),o).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.message);return j})})}
var b64=function(s){return btoa(unescape(encodeURIComponent(s)))},ub=function(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))};
function ls(d){api(d).then(function(a){list.innerHTML=a.filter(function(f){return /\.md$/.test(f.name)}).map(function(f){return '<button class="g" onclick="openF(\''+f.path+'\')">'+f.name+'</button>'}).join('')}).catch(function(e){msg(e.message)})}
function openF(p){api(p).then(function(f){fp.value=p;ed.value=ub(f.content);sha[p]=f.sha})}
function newPost(){fp.value='posts/';ed.value='---\ntitle: \ndescription: \ncategory: insurance\ndate: '+new Date().toISOString().slice(0,10)+'\nslug: \nimage: \nkeywords: \n---\n'}
function savePost(){var p=fp.value,x=ed.value,mm=x.match(/^slug:\s*(.+)$/m);if(p==='posts/'&&mm)p=fp.value='posts/'+mm[1].trim()+'.md';if(!/\.md$/.test(p))return msg('Set a file path');
 api(p).then(function(f){return f.sha},function(){return null}).then(function(s){var b={message:'Update '+p,content:b64(x),branch:br.value};if(s)b.sha=s;return api(p,{method:'PUT',body:JSON.stringify(b)})}).then(function(){msg('Saved. Site rebuilds in ~1 min')}).catch(function(e){msg(e.message)})}
function del(){if(!confirm('Delete '+fp.value+'?'))return;api(fp.value).then(function(f){return api(fp.value,{method:'DELETE',body:JSON.stringify({message:'Delete',sha:f.sha,branch:br.value})})}).then(function(){msg('Deleted');ed.value=''}).catch(function(e){msg(e.message)})}
var F=[['theme.primary','Primary color','color'],['theme.accent','Accent color','color'],['theme.bg','Background','color'],['theme.card','Card color','color'],['theme.text','Text color','color'],['theme.font','Font stack'],['theme.radius','Corner radius'],['theme.heroTitle','Home title'],['theme.heroSub','Home subtitle'],['name','Site name'],['tagline','Tagline'],['url','Site URL (https://...)'],['email','Contact email'],['author','Author name'],['ads.client','AdSense publisher ID (ca-pub-XXXXXXXX)'],['ads.header','Ad slot: header'],['ads.inline','Ad slot: in-article'],['ads.sidebar','Ad slot: sidebar'],['ads.footer','Ad slot: footer'],['ads.ga','Google Analytics ID (G-XXXX)'],['ads.verify','Search Console verification code']];
function g(o,k){return k.split('.').reduce(function(a,b){return a[b]},o)}function st(o,k,v){var a=k.split('.'),l=a.pop();a.reduce(function(x,y){return x[y]},o)[l]=v}
function loadS(){api('settings.json').then(function(f){sha.s=f.sha;S=JSON.parse(ub(f.content));sf.innerHTML=F.map(function(f,i){return '<label>'+f[1]+'</label><input id="f'+i+'" type="'+(f[2]||'text')+'" value="'+String(g(S,f[0])).replace(/"/g,'&quot;')+'">'}).join('')+'<label>Menu categories &amp; pages (JSON)</label><textarea id="cj" style="min-height:200px">'+JSON.stringify({categories:S.categories,pages:S.pages},null,1)+'</textarea><button onclick="saveS()">Save settings</button>'}).catch(function(e){msg(e.message)})}
function saveS(){F.forEach(function(f,i){st(S,f[0],$('f'+i).value)});try{var j=JSON.parse(cj.value);S.categories=j.categories;S.pages=j.pages}catch(e){return msg('Invalid JSON')}
 api('settings.json',{method:'PUT',body:JSON.stringify({message:'Update settings',content:b64(JSON.stringify(S,null,1)),sha:sha.s,branch:br.value})}).then(function(r){sha.s=r.content.sha;msg('Saved. Site rebuilds in ~1 min')}).catch(function(e){msg(e.message)})}
function upImg(){var f=im.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,1200/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);var n=f.name.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString(36)+'.jpg';api('assets/img/'+n,{method:'PUT',body:JSON.stringify({message:'Add image',content:c.toDataURL('image/jpeg',.82).split(',')[1],branch:br.value})}).then(function(){ed.value+='\n![Describe image](/assets/img/'+n+')\n';msg('Uploaded. For the cover use image: /assets/img/'+n)}).catch(function(e){msg(e.message)})};i.src=r.result};r.readAsDataURL(f)}
pr.value='Write an original, genuinely helpful, expert-level article of 1,500-2,000 words on: [TOPIC] for readers in the US, UK, Canada and Australia.\nOutput ONLY a markdown file, no commentary, starting exactly with:\n---\ntitle: (under 60 chars, main keyword first)\ndescription: (140-155 chars, includes keyword, compelling)\ncategory: (one of: insurance, credit-cards-banking, investing, loans-mortgages, taxes-retirement, business-startups, software-ai-tools, web-hosting-cloud, cybersecurity-vpn, legal-immigration)\ndate: YYYY-MM-DD\nslug: short-keyword-slug\nimage: (blank or image URL)\nkeywords: 5 comma-separated keywords\n---\nThen the body: NO H1; intro that uses the keyword in the first 100 words; ## H2 sections with ### H3 where useful; at least one bullet list and one markdown table; practical steps and examples; do not invent statistics or cite fake sources; internal links like [text](/category/insurance/); a final ## FAQ with 4 questions as ### headings with short answers; a ## Conclusion. Plain-English, accurate, no filler, no promises of returns.';
</script></body></html>
